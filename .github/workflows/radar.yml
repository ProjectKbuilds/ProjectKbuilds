name: radar-and-cards

# Self-rated skill radar, live language radar, stat card, and project cards.
# Runs daily (~03:30 ET). Outputs land in assets/ on main.
# The live language radar needs 3+ languages across public repos; until the
# account has that, its step is allowed to fail without breaking the job
# (continue-on-error) — the self-rated radar and cards still refresh.

"on":
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar-and-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Self-rated skill radar
        run: python3 scripts/radar.py --data assets/skills.json -o assets/radar

      - name: Live language radar (best effort)
        continue-on-error: true
        run: >-
          python3 scripts/radar.py --github ${{ github.repository_owner }}
          -o assets/radar-langs --limit 7 --values --curve 0.4
          --exclude "shell,makefile,dockerfile,batchfile,procfile"

      - name: Stat and project cards
        run: python3 scripts/cards.py --user ${{ github.repository_owner }} --out assets
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit refreshed graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/radar-*.svg assets/card-*.svg
          git diff --cached --quiet || git commit -m "chore: refresh radars and cards"
          git push

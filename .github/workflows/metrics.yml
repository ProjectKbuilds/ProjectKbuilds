name: metrics

# 3D contribution calendar, language mix, and achievement badges.
# Runs every 6 hours. Outputs land in assets/ on main.
# Uses the built-in GITHUB_TOKEN, which GitHub provisions fresh for every
# run and cannot expire. The workflow previously used a personal access
# token stored as the METRICS_TOKEN repo secret; that token expired on
# 2026-11-27, and the API started rejecting it with "Bad credentials"
# (HTTP 401 from api.github.com/graphql), failing every run. GITHUB_TOKEN
# covers the public data these plugins need. If private contributions are
# ever needed again, store a fresh PAT as METRICS_TOKEN and switch the
# token inputs back.
"on":
  schedule:
    - cron: "0 */6 * * *" # Runs at 0 minutes past the hour, every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3D isometric contribution calendar.
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.isocalendar.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ProjectKbuilds
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # Language mix across public repos.
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ProjectKbuilds
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          plugin_languages: yes
          plugin_languages_limit: 8

      # Achievement badges.
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.achievements.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ProjectKbuilds
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          plugin_achievements: yes
